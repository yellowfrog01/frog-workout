name: WorkoutLogMac
options:
  bundleIdPrefix: com.gimgeon
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WorkoutLogMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../WorkoutLog/WorkoutLog/Models.swift
      - path: ../WorkoutLog/WorkoutLog/BodyRecord.swift
      - path: ../WorkoutLog/WorkoutLog/PlannedWorkout.swift
      - path: ../WorkoutLog/WorkoutLog/Program.swift
      - path: ../WorkoutLog/WorkoutLog/ProgramData.swift
      - path: ../WorkoutLog/WorkoutLog/Telemetry.swift
      - path: ../WorkoutLog/WorkoutLog/Tracking.swift
      - path: ../WorkoutLog/WorkoutLog/Vitals.swift
      - path: ../WorkoutLog/WorkoutLog/IntervalDetail.swift
      - path: ../WorkoutLog/WorkoutLog/LiftMemo.swift
      - path: ../WorkoutLog/WorkoutLog/LiftTiming.swift
      - path: ../WorkoutLog/WorkoutLog/LiftPhase.swift
      - path: ../WorkoutLog/WorkoutLog/StatusEngine.swift
      - path: ../WorkoutLog/WorkoutLog/StrengthHistory.swift
      - path: ../WorkoutLog/WorkoutLog/SupabaseClient.swift
      - path: ../WorkoutLog/WorkoutLog/SyncMapper.swift
      - path: ../WorkoutLog/WorkoutLog/SyncService.swift
      - path: ../WorkoutLog/WorkoutLog/SyncSettingsView.swift
      - path: ../WorkoutLog/WorkoutLog/Theme.swift
      - path: ../WorkoutLog/WorkoutLog/ActivityViews.swift
      - path: ../WorkoutLog/WorkoutLog/Supabase.plist
        buildPhase: resources
    entitlements:
      path: WorkoutLogMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gimgeon.WorkoutLogMac
        DEVELOPMENT_TEAM: G93P856529
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 운동기록
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
